services:
    web:
        build:
            context: .
            target: runner
        image: csm-web:latest
        pull_policy: build
        container_name: csm-web
        network_mode: bridge
        env_file:
            - .env
        ports:
            - '3003:3000'
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
